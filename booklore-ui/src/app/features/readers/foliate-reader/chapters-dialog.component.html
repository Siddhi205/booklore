<div class="dialog-overlay" (click)="close.emit()">
  <div class="sidebar" (click)="$event.stopPropagation()">
    <div class="sidebar-header">
      <div class="sidebar-header-book">
        @if (bookCoverUrl) {
          <img
            [src]="bookCoverUrl"
            alt="Book cover"
            class="sidebar-book-cover"
          />
        }
        <div class="sidebar-book-meta">
          <div class="sidebar-book-title">{{ bookTitle }}</div>
          @if (bookAuthors) {
            <div class="sidebar-book-authors">{{ bookAuthors }}</div>
          }
        </div>
      </div>
    </div>
    <div class="sidebar-body">
      @switch (activeTab) {
        @case ('chapters') {
          <ul>
            @for (chapter of chapters; track chapter.href) {
              <li (click)="onChapterClick(chapter.href)">{{ chapter.label }}</li>
            }
          </ul>
        }
        @case ('bookmarks') {
          <div class="empty-tab">No bookmarks yet.</div>
        }
        @case ('annotation') {
          <div class="empty-tab">No annotations yet.</div>
        }
      }
    </div>
    <div class="sidebar-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'chapters'"
        (click)="activeTab = 'chapters'"
        aria-label="Chapters"
      >
        <span class="tab-icon">&#128214;</span>
        <span class="tab-label">Chapters</span>
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'bookmarks'"
        (click)="activeTab = 'bookmarks'"
        aria-label="Bookmarks"
      >
        <span class="tab-icon">&#128278;</span>
        <span class="tab-label">Bookmarks</span>
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'annotation'"
        (click)="activeTab = 'annotation'"
        aria-label="Annotation"
      >
        <span class="tab-icon">&#9998;</span>
        <span class="tab-label">Annotation</span>
      </button>
    </div>
  </div>
</div>
