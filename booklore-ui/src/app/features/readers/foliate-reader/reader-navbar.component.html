<div
  class="reader-navbar"
  [style.color]="'#ffffff'"
  [style.background]="'#1a1a1a'"
  [class.visible]="navbarVisible"
  (mouseenter)="onNavbarMouseEnter()"
  (mouseleave)="onNavbarMouseLeave()">

  <button class="icon-btn" title="Previous">
    <span aria-label="Previous">◀</span>
  </button>

  <button class="icon-btn" title="Back">
    <span aria-label="Back">↶</span>
  </button>

  <button class="icon-btn" title="Forward">
    <span aria-label="Forward">↷</span>
  </button>

  <div class="progress-section">
    <button class="location-btn" (click)="toggleLocationPopover()" title="Location">
      <span class="location-text">{{ currentPercentage }}%</span>
    </button>

    <input
      type="range"
      class="progress-slider"
      [min]="0"
      [max]="100"
      [value]="currentPercentage"
      (input)="onProgressChange($event)"
      title="Progress" />
  </div>

  <button class="icon-btn" title="Next">
    <span aria-label="Next">▶</span>
  </button>
</div>

@if (showLocationPopover) {
  <div class="location-popover" [style.color]="'#ffffff'" [style.background]="'#1a1a1a'">
    <div class="popover-content">
      <div class="time-info">
        <div class="time-section">
          <span class="label">Time Left in Section</span>
          <span class="value">{{ timeSection }}</span>
        </div>
        <div class="separator"></div>
        <div class="time-section">
          <span class="label">Time Left in Book</span>
          <span class="value">{{ timeTotal }}</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="location-controls">
        <div class="control-row">
          <label>Page</label>
          <span>{{ currentPage }}</span>
        </div>
        <div class="control-row">
          <label>Location</label>
          <input type="number" [value]="locationCurrent" />
          <span>/ {{ locationTotal }}</span>
        </div>
        <div class="control-row">
          <label>Section</label>
          <span>{{ sectionCurrent }} / {{ sectionTotal }}</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section-navigation">
        <button class="nav-btn" title="First Section">
          <span>⏮</span>
        </button>
        <button class="nav-btn" title="Previous Section">
          <span>◀</span>
        </button>
        <button class="nav-btn" title="Jump To…">
          <span>⋮</span>
        </button>
        <button class="nav-btn" title="Next Section">
          <span>▶</span>
        </button>
        <button class="nav-btn" title="Last Section">
          <span>⏭</span>
        </button>
      </div>
    </div>
  </div>
}
