<div class="reader" [style.background-color]="currentTheme.bg ?? ''">
  <div id="foliate-container"></div>
  <button class="settings-btn" (click)="showControls = true">
    ⚙ Settings
  </button>
  @if (showControls) {
    <div class="dialog-overlay" (click)="showControls = false">
      <div class="dialog" (click)="$event.stopPropagation()">
        <div class="dialog-header">
          <h2>Reader Settings</h2>
          <button class="close-btn" (click)="showControls = false">✕</button>
        </div>

        <div class="dialog-body">
          <section>
            <h3>Navigation</h3>
            <div class="nav-buttons">
              <button (click)="prevPage()">← Previous</button>
              <button (click)="nextPage()">Next →</button>
            </div>
          </section>

          <section>
            <h3>Typography</h3>
            <div class="control">
              <label>Font Size</label>
              <div class="stepper">
                <button (click)="decreaseFontSize()">−</button>
                <span>{{ fontSize }}px</span>
                <button (click)="increaseFontSize()">+</button>
              </div>
            </div>
            <div class="control">
              <label>Line Height</label>
              <div class="stepper">
                <button (click)="decreaseLineHeight()">−</button>
                <span>{{ lineHeight.toFixed(1) }}</span>
                <button (click)="increaseLineHeight()">+</button>
              </div>
            </div>
            <div class="control">
              <label>Columns</label>
              <div class="stepper">
                <button (click)="decreaseMaxColumnCount()">−</button>
                <span>{{ maxColumnCount }}</span>
                <button (click)="increaseMaxColumnCount()">+</button>
              </div>
            </div>
            <div class="control">
              <label>Max Width</label>
              <div class="stepper">
                <button (click)="decreaseMaxInlineSize()">−</button>
                <span>{{ maxInlineSize }}px</span>
                <button (click)="increaseMaxInlineSize()">+</button>
              </div>
            </div>
            <div class="control">
              <label>Max Height</label>
              <div class="stepper">
                <button (click)="decreaseMaxBlockSize()">−</button>
                <span>{{ maxBlockSize }}px</span>
                <button (click)="increaseMaxBlockSize()">+</button>
              </div>
            </div>
            <div class="control">
              <label>Gap</label>
              <input
                #gapInput
                type="range"
                min="0"
                max="0.5"
                step="0.01"
                [value]="gap"
                (input)="setGap(gapInput.valueAsNumber)"
              />
              <span class="value">{{ (gap * 100) | number : '1.0-0' }}%</span>
            </div>
            <div class="control">
              <label>Justify Text</label>
              <button class="toggle" [class.active]="justify" (click)="toggleJustify()">
                {{ justify ? 'On' : 'Off' }}
              </button>
            </div>
            <div class="control">
              <label>Hyphenate</label>
              <button class="toggle" [class.active]="hyphenate" (click)="toggleHyphenate()">
                {{ hyphenate ? 'On' : 'Off' }}
              </button>
            </div>
          </section>

          <section>
            <h3>Appearance</h3>
            <div class="control">
              <label>Theme</label>
              <select [value]="currentTheme.name" (change)="onThemeChange($event)">
                @for (theme of themes; track theme.name) {
                  <option [value]="theme.name">{{ theme.label }}</option>
                }
              </select>
            </div>
            <div class="control">
              <label>Mode</label>
              <button class="toggle" [class.active]="isDarkMode" (click)="toggleLightDark()">
                {{ isDarkMode ? '🌙 Dark' : '☀ Light' }}
              </button>
            </div>
          </section>
        </div>
      </div>
    </div>
  }
</div>
