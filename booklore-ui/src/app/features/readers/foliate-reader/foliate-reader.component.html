<div
  class="reader"
  [style.background-color]="stateService.currentState.theme.bg ?? ''"
>
  <app-reader-header
    [currentChapterName]="currentChapterName"
    [currentTheme]="stateService.currentState.theme"
    (showChapters)="showChapters = true"
    (showControls)="showControls = true"
  ></app-reader-header>
  <div class="reader-content">
    <div id="foliate-container"></div>
  </div>

  @if (showChapters) {
    <app-chapters-dialog
      [bookCoverUrl]="bookCoverUrl"
      [bookTitle]="bookTitle"
      [bookAuthors]="bookAuthors"
      [chapters]="chapters"
      (close)="showChapters = false"
      (chapterClick)="onChapterClick($event)"
    ></app-chapters-dialog>
  }

  @if (showControls) {
    <app-settings-dialog
      [stateService]="stateService"
      [viewManager]="viewManager"
      [bookId]="bookId"
      (close)="showControls = false"
    ></app-settings-dialog>
  }
</div>
